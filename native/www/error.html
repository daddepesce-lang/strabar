<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Strabar — offline</title>
    <!--
      Schermata mostrata dalla WebView quando il caricamento di https://strabar.app fallisce
      (`server.errorPath` in capacitor.config.json). Su Android questa pagina NON ha accesso
      ai plugin Capacitor: solo HTML/JS puro, nessun `window.Capacitor`.
    -->
    <style>
      :root { color-scheme: dark; }
      html, body { margin: 0; min-height: 100%; background: #0a0a0d; color: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        -webkit-tap-highlight-color: transparent; }
      main { min-height: 100vh; display: grid; place-content: center; justify-items: center;
        text-align: center; padding: 24px calc(24px + env(safe-area-inset-left, 0px)); gap: 14px; }
      .logo { font-size: 34px; letter-spacing: .06em; font-weight: 800; }
      h1 { font-size: 19px; margin: 6px 0 0; font-weight: 700; }
      p { margin: 0; color: #9a9aa5; font-size: 14px; line-height: 1.5; max-width: 300px; }
      button { margin-top: 10px; border: 0; border-radius: 999px; padding: 14px 30px;
        background: #ff3b2f; color: #fff; font-size: 15px; font-weight: 700; }
      button:active { transform: scale(.97); }
      .hint { font-size: 12px; color: #6b6b76; }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">🍻</div>
      <h1>Niente rete</h1>
      <p>Strabar ha bisogno di una connessione per caricare le tue sessioni, i locali e le classifiche.</p>
      <button type="button" id="retry">Riprova</button>
      <p class="hint" id="status"></p>
    </main>
    <script>
      var status = document.getElementById('status');
      function retry() {
        status.textContent = 'Riconnessione…';
        location.replace('https://strabar.app/');
      }
      document.getElementById('retry').addEventListener('click', retry);
      // Se la rete torna da sola mentre l'utente guarda questa schermata, rientriamo subito.
      window.addEventListener('online', retry);
    </script>
  </body>
</html>
